name: Build RISC-V Environment

on:
  workflow_dispatch:
  push:
    branches:
      - msyksphinz/riscv
  schedule:
    # Run once per day at 2:00 AM JST (17:00 UTC previous day)
    - cron: '0 17 * * *'

jobs:
  build-docker:
    runs-on: self-hosted
    steps:
    - name: Clean workspace
      run: |
        # Clean up workspace directory to avoid permission issues
        WORKSPACE_DIR="${{ github.workspace }}"
        if [ -d "$WORKSPACE_DIR" ]; then
          echo "Cleaning workspace directory: $WORKSPACE_DIR"
          # Try to remove files without sudo first
          rm -rf "$WORKSPACE_DIR"/* "$WORKSPACE_DIR"/.[!.]* 2>/dev/null || true
          # If there are permission issues, try with sudo (requires NOPASSWD setup)
          # Note: This requires /etc/sudoers configuration:
          # username ALL=(ALL) NOPASSWD: /bin/rm, /bin/chown
          if [ -n "$(ls -A "$WORKSPACE_DIR" 2>/dev/null)" ]; then
            echo "Some files remain, attempting with sudo (requires NOPASSWD setup)..."
            sudo rm -rf "$WORKSPACE_DIR"/* "$WORKSPACE_DIR"/.[!.]* 2>/dev/null || true
            sudo chown -R $(whoami):$(whoami) "$WORKSPACE_DIR" 2>/dev/null || true
          fi
        fi
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Build Docker image
      run: |
        # Build Docker image from repository Dockerfile on the runner server
        docker build -t sniper-riscv:latest \
          -f docker/Dockerfile-ubuntu-24.04 .

  build-riscv:
    runs-on: self-hosted
    needs: build-docker
    timeout-minutes: 360  # 6 hours timeout
    
    steps:
    - name: Clean workspace
      run: |
        # Clean up workspace directory to avoid permission issues
        WORKSPACE_DIR="${{ github.workspace }}"
        if [ -d "$WORKSPACE_DIR" ]; then
          echo "Cleaning workspace directory: $WORKSPACE_DIR"
          # Try to remove files without sudo first
          rm -rf "$WORKSPACE_DIR"/* "$WORKSPACE_DIR"/.[!.]* 2>/dev/null || true
          # If there are permission issues, try with sudo (requires NOPASSWD setup)
          # Note: This requires /etc/sudoers configuration:
          # username ALL=(ALL) NOPASSWD: /bin/rm, /bin/chown
          if [ -n "$(ls -A "$WORKSPACE_DIR" 2>/dev/null)" ]; then
            echo "Some files remain, attempting with sudo (requires NOPASSWD setup)..."
            sudo rm -rf "$WORKSPACE_DIR"/* "$WORKSPACE_DIR"/.[!.]* 2>/dev/null || true
            sudo chown -R $(whoami):$(whoami) "$WORKSPACE_DIR" 2>/dev/null || true
          fi
        fi
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Build RISC-V environment
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          -e PIN_ROOT=${PIN_ROOT:-/home/kimura/sniper_tools/pin-3.18-98332-gaebd7b1e6-gcc-linux} \
          -e CPU2006_ROOT=${CPU2006_ROOT:-/home/kimura/sniper_tools/cpu2006_dummy} \
          -e SNIPER_ROOT=/workspace \
          sniper-riscv:latest bash -c "
            # Get number of CPUs available in the container (use half)
            NPROC=\$((\$(nproc) / 2))
            echo \"Using \${NPROC} parallel jobs (half of available CPUs)\"
            # Run build script
            bash riscv/build-riscv.sh
          "

